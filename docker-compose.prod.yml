services:
  backend:
    image: ghcr.io/smroutes/data-hub-backend:${IMAGE_TAG:-latest}
    environment:
      R2_BUCKET: ${R2_BUCKET:-}
      R2_OBJECT_KEY_ANNAPURNA: ${R2_OBJECT_KEY_ANNAPURNA:-}
      R2_OBJECT_KEY_BOOTH_PRESIDENT: ${R2_OBJECT_KEY_BOOTH_PRESIDENT:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
    volumes:
      - cache:/app/cache
    restart: unless-stopped

  frontend:
    image: ghcr.io/smroutes/data-hub-frontend:${IMAGE_TAG:-latest}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cache:
  caddy_data:
  caddy_config:
