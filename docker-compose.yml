services:
  backend:
    build: .
    environment:
      R2_BUCKET: ${R2_BUCKET:-}
      R2_OBJECT_KEY_ANNAPURNA: ${R2_OBJECT_KEY_ANNAPURNA:-}
      R2_OBJECT_KEY_BOOTH_PRESIDENT: ${R2_OBJECT_KEY_BOOTH_PRESIDENT:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    volumes:
      - ./sheet-data:/data:ro
      - cache:/app/cache
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cache:
  caddy_data:
  caddy_config:
